[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/agent-core",
    "crates/agent-index",
    "crates/agent-protocol-types",
    "crates/agent-session-core",
    "crates/agent-knowledge",
    "crates/agent-runtime",
    "crates/agent-services",
    "crates/agent-sqlite",
    "crates/querymt",
    "crates/querymt-remote",
    "crates/cli",
    "crates/provider-common",
    "crates/querymt-utils",
    "crates/service-client",
    "crates/qmacp",
    "crates/qmcp",
    "crates/providers/*",
    "crates/querymt-extism-macros",
    "crates/querymt-mobile-ffi",
    "crates/py/querymt-py",
    "crates/py/querymt-agent-py",
    "crates/querymt-gpui",
    "crates/workspace-hack",
]
# What plain `cargo build/run/test/check` selects from the repository root.
# Deliberately excludes the WASM provider plugins (`crates/providers/*`, built
# for wasm32 by their own workflows): they default to the `extism` feature and
# are cdylibs, so compiling them for the host fails at link time with undefined
# `extism` host symbols (`alloc`, `error_set`, `qmt_http_request`, ...). Also
# excluded are the packages that need external tooling (Python extension
# modules, the mobile FFI), the heavy native providers (llama-cpp, izwi,
# mrs) and the GPUI desktop app (querymt-gpui, which needs GPUI's system
# libraries on Linux). Use `--workspace` or `-p <package>` to select those
# explicitly.
default-members = [
    "crates/agent",
    "crates/agent-core",
    "crates/agent-index",
    "crates/agent-protocol-types",
    "crates/agent-session-core",
    "crates/agent-knowledge",
    "crates/agent-runtime",
    "crates/agent-services",
    "crates/agent-sqlite",
    "crates/querymt",
    "crates/querymt-remote",
    "crates/cli",
    "crates/provider-common",
    "crates/querymt-utils",
    "crates/service-client",
    "crates/qmacp",
    "crates/qmcp",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

# Clippy lints for needless copies. A crate opts in with `[lints] workspace = true`
# (a crate cannot mix that with its own `[lints.*]` tables).
#
# Deliberately NOT enabled:
# - `needless_pass_by_ref_mut`: unreliable around `async fn`. Taking `&self`
#   instead of `&mut self` can make the future non-`Send` (the type is not
#   `Sync`), which it did in agent-runtime.
# - `clone_on_ref_ptr`: `x.clone()` on an `Arc` is only a refcount bump, so it
#   finds no real copies and flags ~1000 call sites in agent-runtime.
# - `redundant_clone`: in clippy's experimental `nursery` group. CI installs
#   the latest stable toolchain, so a new clippy release could change what it
#   flags and fail unrelated PRs. Run it as an occasional sweep instead:
#     cargo clippy --fix --allow-dirty -p <pkg> --all-targets -- \
#       -A clippy::all -A unused -W clippy::redundant_clone
#   (`-A unused` stops rustc's own unused-import/`mut` fixes from riding along.)
# - `ptr_arg`, `needless_lifetimes`: already on by default (`clippy::style`).
[workspace.lints.clippy]
# Owned argument that the function only borrows. Allow it where the owned type
# is needed so the function can be passed to `map_err`, or where the by-value
# parameter performs an unsizing/upcast coercion (`Arc<dyn A>` -> `Arc<dyn B>`).
needless_pass_by_value = "warn"
# `&Option<T>` forces callers to own an `Option<T>`; `Option<&T>` does not.
ref_option = "warn"
unnecessary_to_owned = "warn"
# `.to_path_buf()` / `.to_string()` / `.to_owned()` where the value is already owned.
implicit_clone = "warn"
# `x = y.clone()` instead of `x.clone_from(&y)`, which can reuse x's allocation.
assigning_clones = "warn"
# Small `Copy` types passed by reference, and big types passed by value.
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
either = { version = "1.15.0", features = ["serde"] }
http = "1.0"
base64 = "0.23.0"
mime = "0.3"
url = { version = "2.5", features = ["serde"] }
schemars = "1.0"
jsonschema = { version = "0.61", default-features = false }
futures = "0.3"
log = "0.4"
extism-pdk = "1.4"
tracing = "0.1"
http-serde-ext = "1.0"
regex = "1"
heck = "0.5"
typeshare = "1.0"
dirs = "7"
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
toml = "1"
thiserror = "2.0"
anyhow = "1.0"
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3", features = ["serde", "formatting", "macros", "local-offset"] }
uuid = { version = "1.18", features = ["v4", "v5", "v7"] }
agent-client-protocol = { version = "5.4", features = ["unstable", "schemars"] }
# Must resolve to the same version that agent-client-protocol re-exports (asserted in agent-core).
agent-client-protocol-schema = { version = "1.19", default-features = false, features = ["unstable"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rust-stemmers = "1.2"
mockall = "0.15"
rusqlite = { version = "0.43", features = ["bundled"] }
# pyo3 sets `links = "pyo3-python"` and pyo3-async-runtimes 0.N requires pyo3 0.N:
# always bump these two together.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30", features = ["attributes", "tokio-runtime"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# The QueryMT Desktop app (crates/querymt-gpui): prioritize the shipped
# executable's size over compile time and peak throughput. Kept as named
# profiles so qmt/qmtcode release builds are unaffected.
[profile.release-gpui]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
panic = "abort"
incremental = false

[profile.release-gpui-web]
inherits = "release-gpui"
# wasm-bindgen needs target-feature metadata; wasm-opt strips names afterward.
strip = "debuginfo"
