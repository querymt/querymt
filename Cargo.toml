[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/agent-core",
    "crates/agent-index",
    "crates/agent-knowledge",
    "crates/querymt",
    "crates/querymt-remote",
    "crates/cli",
    "crates/provider-common",
    "crates/querymt-utils",
    "crates/service-client",
    "crates/providers/*",
    "crates/querymt-extism-macros",
    "crates/querymt-mobile-ffi",
    "crates/py/querymt-py",
    "crates/py/querymt-agent-py",
]
# What plain `cargo build/run/test/check` selects from the repository root.
# Deliberately excludes the WASM provider plugins (`crates/providers/*`, built
# for wasm32 by their own workflows): they default to the `extism` feature and
# are cdylibs, so compiling them for the host fails at link time with undefined
# `extism` host symbols (`alloc`, `error_set`, `qmt_http_request`, ...). Also
# excluded are the packages that need external tooling (Python extension
# modules, the mobile FFI) and the heavy native providers (llama-cpp, izwi,
# mrs). Use `--workspace` or `-p <package>` to select those explicitly.
default-members = [
    "crates/agent",
    "crates/agent-core",
    "crates/agent-index",
    "crates/agent-knowledge",
    "crates/querymt",
    "crates/querymt-remote",
    "crates/cli",
    "crates/provider-common",
    "crates/querymt-utils",
    "crates/service-client",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
either = { version = "1.15.0", features = ["serde"] }
http = "1.0"
base64 = "0.23.0"
mime = "0.3"
url = { version = "2.5", features = ["serde"] }
schemars = "1.0"
futures = "0.3"
log = "0.4"
extism-pdk = "1.4"
tracing = "0.1"
http-serde-ext = "1.0"
regex = "1"
heck = "0.5"
typeshare = "1.0"
dirs = "7"
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
toml = "1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
