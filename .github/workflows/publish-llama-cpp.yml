name: "Build & Publish: llama-cpp Provider"

on:
  push:
    branches: [main]
    tags: [ 'v*.*.*' ]
    paths:
      - 'crates/providers/llama-cpp/**'
      - 'crates/querymt/**'
      - 'crates/provider-common/**'
      - '.github/actions/native-setup/**'
      - '.github/actions/native-publish/**'
      - '.github/workflows/publish-llama-cpp.yml'
      - '.github/workflows/native-create-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ───────────────────────────────────────────────────────
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: vulkan
            feature_tag: vulkan
            needs_cuda: "false"

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: vulkan
            feature_tag: vulkan
            needs_cuda: "false"

          # ── Linux CUDA (combined strategy — wide GPU range) ─────────────
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"
            extra_env: '{"CMAKE_POSITION_INDEPENDENT_CODE":"ON"}'

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"
            extra_env: '{"CMAKE_POSITION_INDEPENDENT_CODE":"ON"}'

          # Linux ROCm: match llama.cpp's Linux Docker SDK and fat-build targets.
          # https://github.com/ggml-org/llama.cpp/blob/59d5fad7c111d30a547d690b69235ed9e05c035d/.devops/rocm.Dockerfile
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            features: rocm
            feature_tag: rocm7.2
            needs_cuda: "false"
            rocm_version: "7.2.1"
            extra_env: >-
              {"CMAKE_HIP_ARCHITECTURES":"gfx908;gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1151;gfx1150;gfx1200;gfx1201",
               "CMAKE_POSITION_INDEPENDENT_CODE":"ON","CMAKE_BUILD_PARALLEL_LEVEL":"2"}

          # ── macOS ───────────────────────────────────────────────────────
          - os: darwin
            arch: amd64
            target: x86_64-apple-darwin
            runner: macos-latest
            features: metal
            feature_tag: metal
            needs_cuda: "false"

          - os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            features: metal
            feature_tag: metal
            needs_cuda: "false"

          # ── Windows ─────────────────────────────────────────────────────
          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          # TODO: Re-enable Vulkan on Windows after fixing llama-cpp-sys-2's
          # CMake ExternalProject install step. Currently fails with
          # "cmake_install.cmake: Not a file" on MSBuild.
          # - os: windows
          #   arch: amd64
          #   target: x86_64-pc-windows-msvc
          #   runner: windows-latest
          #   features: vulkan
          #   feature_tag: vulkan
          #   needs_cuda: "false"

          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            # windows-latest now ships VS 2026 (v18), whose Visual Studio
            # Integration CUDA 12.8 does not declare, causing CMake's
            # enable_language(CUDA) under the VS generator to fail with
            # "No CUDA toolset found". Pin windows-2022 (VS 17) for the CUDA
            # build; the default (non-CUDA) Windows build stays on
            # windows-latest.
            runner: windows-2022
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Free disk space for ROCm SDK and fat build
        if: runner.os == 'Linux' && contains(matrix.features, 'rocm')
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          large-packages: false
          docker-images: false
          tool-cache: false
          swap-storage: false

      - name: Setup
        uses: ./.github/actions/native-setup
        with:
          crate: llama-cpp
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          feature_tag: ${{ matrix.feature_tag }}
          needs_cuda: ${{ matrix.needs_cuda }}
          cuda_version: ${{ matrix.cuda_version || '12.8' }}
          extra_env: ${{ matrix.extra_env || '{}' }}

      # ── llama-cpp-specific build dependencies ───────────────────────────

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install ROCm SDK (Linux)
        if: runner.os == 'Linux' && contains(matrix.features, 'rocm')
        env:
          ROCM_VERSION: ${{ matrix.rocm_version }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} noble main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | \
            sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          # Compiler, device libraries, and BLAS only; no GPU driver is needed to build.
          sudo apt-get install -y --no-install-recommends hip-dev rocm-device-libs hipblas-dev rocblas-dev
          sudo apt-get clean

          rocm_path="/opt/rocm-${ROCM_VERSION}"
          {
            echo "ROCM_PATH=$rocm_path"
            echo "HIP_PATH=$rocm_path"
            echo "CMAKE_HIP_COMPILER=$rocm_path/llvm/bin/clang"
            echo "CMAKE_PREFIX_PATH=$rocm_path"
          } >> "$GITHUB_ENV"
          echo "$rocm_path/bin" >> "$GITHUB_PATH"
          printf '%s/lib\n%s/lib64\n' "$rocm_path" "$rocm_path" | \
            sudo tee /etc/ld.so.conf.d/querymt-rocm.conf
          sudo ldconfig

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux' && contains(matrix.features, 'vulkan')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc glslang-tools
          # The bundled llama.cpp now calls find_package(SPIRV-Headers).
          # Ubuntu's spirv-headers apt package ships no CMake config file, so
          # install SPIRV-Headers from source into /usr/local (a CMake default
          # search path) so find_package(SPIRV-Headers) resolves.
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build
          sudo cmake --install /tmp/spirv-headers/build

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && contains(matrix.features, 'vulkan')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ── Build & Publish ─────────────────────────────────────────────────

      - name: Build & Publish
        uses: ./.github/actions/native-publish
        with:
          crate: llama-cpp
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          feature_tag: ${{ matrix.feature_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.actor }}
          repository_owner: ${{ github.repository_owner }}

  create-manifests:
    needs: build
    if: needs.build.result == 'success'
    uses: ./.github/workflows/native-create-manifests.yml
    with:
      provider: llama-cpp
      is_tagged_release: ${{ github.ref_type == 'tag' }}
    secrets: inherit
