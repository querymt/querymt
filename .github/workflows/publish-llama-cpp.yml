name: "Build & Publish: llama-cpp Provider"

on:
  push:
    branches: [main, experimental/llama-cpp-dflash2]
    tags: [ 'v*.*.*', 'dflash2-v*.*.*' ]
    paths:
      - 'crates/providers/llama-cpp/**'
      - 'Cargo.lock'
      - 'crates/querymt/**'
      - 'crates/provider-common/**'
      - '.github/actions/native-setup/**'
      - '.github/actions/native-publish/**'
      - '.github/workflows/publish-llama-cpp.yml'
      - '.github/workflows/native-create-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      alias: ${{ steps.release.outputs.alias }}
    steps:
      - name: Derive artifact metadata
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" == "experimental/llama-cpp-dflash2" || "$REF_NAME" == dflash2-v* ]]; then
            channel="dflash2"
            if [[ "$REF_TYPE" == "tag" ]]; then
              [[ "$REF_NAME" =~ ^dflash2-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
                echo "Invalid DFlash2 release tag: $REF_NAME" >&2
                exit 1
              }
              version="${BASH_REMATCH[1]}"
              alias="stable"
            else
              version="edge-${SHA:0:8}"
              alias="latest"
            fi
          else
            channel=""
            alias=$([[ "$REF_TYPE" == "tag" ]] && echo stable || echo latest)
            version=""
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ───────────────────────────────────────────────────────
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: vulkan
            feature_tag: vulkan
            needs_cuda: "false"

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: vulkan
            feature_tag: vulkan
            needs_cuda: "false"

          # ── Linux CUDA (combined strategy — wide GPU range) ─────────────
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"
            extra_env: '{"CMAKE_POSITION_INDEPENDENT_CODE":"ON"}'

          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"
            extra_env: '{"CMAKE_POSITION_INDEPENDENT_CODE":"ON"}'

          # ── macOS ───────────────────────────────────────────────────────
          - os: darwin
            arch: amd64
            target: x86_64-apple-darwin
            runner: macos-latest
            features: metal
            feature_tag: metal
            needs_cuda: "false"

          - os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            features: metal
            feature_tag: metal
            needs_cuda: "false"

          # ── Windows ─────────────────────────────────────────────────────
          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            features: ""
            feature_tag: default
            needs_cuda: "false"

          # TODO: Re-enable Vulkan on Windows after fixing llama-cpp-sys-2's
          # CMake ExternalProject install step. Currently fails with
          # "cmake_install.cmake: Not a file" on MSBuild.
          # - os: windows
          #   arch: amd64
          #   target: x86_64-pc-windows-msvc
          #   runner: windows-latest
          #   features: vulkan
          #   feature_tag: vulkan
          #   needs_cuda: "false"

          - os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            # windows-latest now ships VS 2026 (v18), whose Visual Studio
            # Integration CUDA 12.8 does not declare, causing CMake's
            # enable_language(CUDA) under the VS generator to fail with
            # "No CUDA toolset found". Pin windows-2022 (VS 17) for the CUDA
            # build; the default (non-CUDA) Windows build stays on
            # windows-latest.
            runner: windows-2022
            features: cuda
            feature_tag: cuda12.8
            needs_cuda: "true"
            cuda_version: "12.8"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Enable long paths for Windows Cargo checkouts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.longpaths true
          echo "CARGO_HOME=C:\c" >> $env:GITHUB_ENV
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV

      - name: Setup
        uses: ./.github/actions/native-setup
        with:
          crate: llama-cpp
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          feature_tag: ${{ matrix.feature_tag }}
          needs_cuda: ${{ matrix.needs_cuda }}
          cuda_version: ${{ matrix.cuda_version || '12.8' }}
          extra_env: ${{ matrix.extra_env || '{}' }}
          version_override: ${{ needs.metadata.outputs.version }}

      # ── llama-cpp-specific build dependencies ───────────────────────────

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux' && contains(matrix.features, 'vulkan')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc glslang-tools
          # The bundled llama.cpp now calls find_package(SPIRV-Headers).
          # Ubuntu's spirv-headers apt package ships no CMake config file, so
          # install SPIRV-Headers from source into /usr/local (a CMake default
          # search path) so find_package(SPIRV-Headers) resolves.
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build
          sudo cmake --install /tmp/spirv-headers/build

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && contains(matrix.features, 'vulkan')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ── Build & Publish ─────────────────────────────────────────────────

      - name: Build & Publish
        uses: ./.github/actions/native-publish
        with:
          crate: llama-cpp
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          feature_tag: ${{ matrix.feature_tag }}
          channel: ${{ needs.metadata.outputs.channel }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.actor }}
          repository_owner: ${{ github.repository_owner }}

  create-manifests:
    needs: [metadata, build]
    if: needs.build.result == 'success'
    uses: ./.github/workflows/native-create-manifests.yml
    with:
      provider: llama-cpp
      is_tagged_release: ${{ github.ref_type == 'tag' }}
      channel: ${{ needs.metadata.outputs.channel }}
      alias: ${{ needs.metadata.outputs.alias }}
    secrets: inherit
