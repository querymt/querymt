name: Build Binaries (Reusable)

on:
  workflow_call:
    inputs:
      version_name:
        description: 'Asset label used in artifact names (e.g., v1.0.0 or nightly)'
        required: true
        type: string
      qmt_version:
        description: 'Version embedded in the binaries as QMT_VERSION (e.g., v1.0.0 or 0.6.0-nightly.20261105111147)'
        required: true
        type: string
      is_nightly:
        description: 'Whether this is a nightly build'
        required: false
        type: boolean
        default: false
      dashboard_revision:
        description: 'Published querymt-desktop revision to embed'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dashboard-ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout embedded dashboard source
        uses: actions/checkout@v7
        with:
          repository: querymt/querymt-desktop
          ref: ${{ inputs.dashboard_revision }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build and verify embedded dashboard
        env:
          QUERYMT_UI_REVISION: ${{ inputs.dashboard_revision }}
        run: |
          npm ci
          npm run test:embedded
          npm run build:embedded
          test -f build-embedded/index.html
          test "$(jq -r .target build-embedded/querymt-ui.json)" = embedded
          test "$(jq -r .acpWebSocketPath build-embedded/querymt-ui.json)" = /acp/ws
          test "$(git rev-parse HEAD)" = "$QUERYMT_UI_REVISION"
          test "$(jq -r .revision build-embedded/querymt-ui.json)" = "$QUERYMT_UI_REVISION"

      - name: Upload embedded dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-ui
          path: build-embedded
          if-no-files-found: error

  build:
    name: Build ${{ matrix.binary }} for ${{ matrix.target }}
    needs: dashboard-ui
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Linux (Static MUSL) ──────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
            cargo_features: zbus-secret-service,systemd-credentials
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
            cargo_features: zbus-secret-service,systemd-credentials
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,zbus-secret-service,systemd-credentials,remote
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,zbus-secret-service,systemd-credentials,remote
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmacp
            bin_name: qmacp
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmacp
            bin_name: qmacp
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmcp
            bin_name: qmcp
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmcp
            bin_name: qmcp
            archive_ext: tar.gz

          # ─── macOS ─────────────────────────────────────────────────────────
          - os: macos-15
            target: x86_64-apple-darwin
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
          - os: macos-15
            target: aarch64-apple-darwin
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
          - os: macos-15
            target: x86_64-apple-darwin
            binary: qmacp
            bin_name: qmacp
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: qmacp
            bin_name: qmacp
            archive_ext: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            binary: qmcp
            bin_name: qmcp
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: qmcp
            bin_name: qmcp
            archive_ext: tar.gz

          # ─── Windows (Static CRT) ────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmt
            bin_name: qmt.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmt
            bin_name: qmt.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmtcode
            bin_name: qmtcode.exe
            archive_ext: zip
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmtcode
            bin_name: qmtcode.exe
            archive_ext: zip
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmacp
            bin_name: qmacp.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmacp
            bin_name: qmacp.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmcp
            bin_name: qmcp.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmcp
            bin_name: qmcp.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"

          # ─── FreeBSD ──────────────────────────────────────────────────────────────
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmacp
            bin_name: qmacp
            archive_ext: tar.gz
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmcp
            bin_name: qmcp
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.binary }}

      - name: Download embedded dashboard
        if: matrix.binary == 'qmtcode'
        uses: actions/download-artifact@v8
        with:
          name: dashboard-ui
          path: dashboard-ui

      # Build qmt binary (default package)
      - name: Build qmt with Cargo
        if: matrix.binary == 'qmt'
        env:
          QMT_VERSION: ${{ inputs.qmt_version }}
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --release --bin qmt --features "${{ matrix.cargo_features }}" --target ${{ matrix.target }}

      # Build qmtcode example binary
      - name: Build qmtcode with Cargo
        if: matrix.binary == 'qmtcode'
        env:
          QMT_VERSION: ${{ inputs.qmt_version }}
          QMT_UI_DIST: ${{ format('{0}/dashboard-ui', github.workspace) }}
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --release -p ${{ matrix.cargo_package }} --example qmtcode --features "${{ matrix.cargo_features }}" --target ${{ matrix.target }}

      # Build the standalone ACP (qmacp) and MCP (qmcp) client binaries.
      # Their version is the workspace version plus the git SHA (build.rs).
      - name: Build ${{ matrix.binary }} with Cargo
        if: matrix.binary == 'qmacp' || matrix.binary == 'qmcp'
        env:
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --locked --release -p ${{ matrix.binary }} --bin ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Prepare artifact for upload (Linux, macOS & FreeBSD)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          ARTIFACT_DIR="dist"
          PKG="${{ matrix.binary }}-${{ inputs.version_name }}-${{ matrix.target }}"
          STAGING="$ARTIFACT_DIR/$PKG"
          mkdir -p "$STAGING"
          
          # Copy binary from appropriate location (qmtcode is a cargo example)
          if [ "${{ matrix.binary }}" = "qmtcode" ]; then
            cp "target/${{ matrix.target }}/release/examples/${{ matrix.bin_name }}" "$STAGING/"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGING/"
          fi
          
          # The standalone clients ship their own crate README.
          README=README.md
          if [ -f "crates/${{ matrix.binary }}/README.md" ]; then
            README="crates/${{ matrix.binary }}/README.md"
          fi
          cp "$README" LICENSE "$STAGING/"
          case "${{ matrix.binary }}" in
            qmacp) cp crates/qmacp/LICENSE "$STAGING/LICENSE-qmacp" ;;
            qmcp)
              cp crates/qmacp/LICENSE "$STAGING/LICENSE-qmacp"
              cp crates/qmcp/LICENSE "$STAGING/LICENSE-qmcp"
              mkdir -p "$STAGING/docs"
              cp crates/qmcp/docs/how-to-connect.md "$STAGING/docs/"
              ;;
          esac
          tar -czf "$ARTIFACT_DIR/${PKG}.tar.gz" -C "$ARTIFACT_DIR" "$PKG"
          echo "ASSET_PATH=$ARTIFACT_DIR/${PKG}.tar.gz" >> $GITHUB_ENV

      - name: Prepare artifact for upload (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ARTIFACT_DIR = "dist"
          $PKG = "${{ matrix.binary }}-${{ inputs.version_name }}-${{ matrix.target }}"
          $STAGING = Join-Path $ARTIFACT_DIR $PKG
          New-Item -ItemType Directory -Force -Path $STAGING
          
          # Copy binary from appropriate location (qmtcode is a cargo example)
          if ("${{ matrix.binary }}" -eq "qmtcode") {
            Copy-Item "target/${{ matrix.target }}/release/examples/${{ matrix.bin_name }}" -Destination $STAGING
          } else {
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $STAGING
          }
          
          # The standalone clients ship their own crate README.
          $README = "README.md"
          if (Test-Path "crates/${{ matrix.binary }}/README.md") {
            $README = "crates/${{ matrix.binary }}/README.md"
          }
          Copy-Item $README, LICENSE -Destination $STAGING
          if ("${{ matrix.binary }}" -in @("qmacp", "qmcp")) {
            Copy-Item crates/qmacp/LICENSE -Destination (Join-Path $STAGING 'LICENSE-qmacp')
          }
          if ("${{ matrix.binary }}" -eq "qmcp") {
            Copy-Item crates/qmcp/LICENSE -Destination (Join-Path $STAGING 'LICENSE-qmcp')
            $DOCS = Join-Path $STAGING 'docs'
            New-Item -ItemType Directory -Force -Path $DOCS
            Copy-Item crates/qmcp/docs/how-to-connect.md -Destination $DOCS
          }
          $ZIP_PATH = "$ARTIFACT_DIR/${PKG}.zip"
          Compress-Archive -Path (Join-Path $STAGING '*') -DestinationPath $ZIP_PATH -Force
          echo "ASSET_PATH=${ZIP_PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}

  # ─── QueryMT Desktop (crates/querymt-gpui) ──────────────────────────────────
  # Native installers, named QueryMT-Desktop-<version_name>-<platform>.<ext>.
  # The artifact names start with `qmt-desktop-` so the release jobs' `qm*-*`
  # download pattern picks them up.
  desktop:
    name: Build QueryMT Desktop for ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64-setup
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            arch: x86_64
            nfpm_arch: x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
            arch: aarch64
            nfpm_arch: arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    env:
      QMT_VERSION: ${{ inputs.qmt_version }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-desktop

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_VERSION: '2.48.0'
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          APPIMAGE_RUNTIME_VERSION: '20251108'
          APPIMAGE_RUNTIME_SHA256: ${{ matrix.appimage_runtime_sha256 }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $HOME/.local/bin/appimagetool" | sha256sum --check --strict
          curl -fsSL -o "$HOME/.local/bin/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${APPIMAGE_ARCH}"
          echo "${APPIMAGE_RUNTIME_SHA256}  $HOME/.local/bin/appimage-runtime" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/nfpm" "$HOME/.local/bin/appimagetool" \
            "$HOME/.local/bin/appimage-runtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # GPUI compiles its Metal shaders with `xcrun metal`; Xcode 26 ships the
      # Metal toolchain as a separate component.
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      # QMT_VERSION (env) is what the app reports (crates/querymt-gpui/build.rs).
      - name: Build QueryMT Desktop
        shell: bash
        run: cargo build --locked -p querymt-gpui --profile release-gpui --target ${{ matrix.target }}

      # Bundle metadata (Info.plist, deb, NSIS) needs X.Y.Z[-pre], without the v.
      - name: Package macOS bundles
        if: runner.os == 'macOS'
        run: bash crates/querymt-gpui/scripts/package/macos.sh "${QMT_VERSION#v}" ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: bash crates/querymt-gpui/scripts/package/windows.sh "${QMT_VERSION#v}" ${{ matrix.target }}

      - name: Package Linux bundles
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_RUNTIME_FILE="$HOME/.local/bin/appimage-runtime" \
            bash crates/querymt-gpui/scripts/package/linux.sh "${QMT_VERSION#v}" ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_PREFIX: QueryMT-Desktop
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          DIST: dist-desktop
        run: bash crates/querymt-gpui/scripts/release/collect-bundles.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qmt-desktop-${{ matrix.target }}
          path: dist-desktop/*
          if-no-files-found: error

  # The wasm build of QueryMT Desktop, packaged so qmtcode or any static server
  # can serve it: querymt-desktop-web-<version_name>.tar.gz.
  desktop-web:
    name: Build QueryMT Desktop web
    runs-on: ubuntu-latest
    env:
      QMT_VERSION: ${{ inputs.qmt_version }}
      VERSION_NAME: ${{ inputs.version_name }}
      # Must match the `wasm-bindgen` crate version in Cargo.lock (see flake.nix).
      WASM_BINDGEN_VERSION: '0.2.130'
      BINARYEN_VERSION: '133'
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: wasm32-desktop-web

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      - name: Install wasm-opt (binaryen)
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/binaryen.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build web app
        run: crates/querymt-gpui/web/build.sh --release

      - name: Package web app
        working-directory: crates/querymt-gpui
        run: |
          test -f dist/index.html
          test -f dist/querymt_gpui.js
          test -s dist/querymt_gpui_bg.wasm
          grep -q 'querymt_gpui.js' dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/dist-desktop"
          tar -czf "$GITHUB_WORKSPACE/dist-desktop/querymt-desktop-web-${VERSION_NAME}.tar.gz" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qmt-desktop-web
          path: dist-desktop/*
          if-no-files-found: error
