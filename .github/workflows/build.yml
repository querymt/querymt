name: Build Binaries (Reusable)

on:
  workflow_call:
    inputs:
      version_name:
        description: 'Version identifier (e.g., v1.0.0 or nightly-abc1234)'
        required: true
        type: string
      is_nightly:
        description: 'Whether this is a nightly build'
        required: false
        type: boolean
        default: false
      dashboard_revision:
        description: 'Published querymt-desktop revision to embed'
        required: false
        type: string
        default: '6096eb9741ac080062f164a9aa565718796bf5d7'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dashboard-ui:
    name: Build dashboard UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout embedded dashboard source
        uses: actions/checkout@v7
        with:
          repository: querymt/querymt-desktop
          ref: ${{ inputs.dashboard_revision }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Build and verify embedded dashboard
        env:
          QUERYMT_UI_REVISION: ${{ inputs.dashboard_revision }}
        run: |
          npm ci
          npm run test:embedded
          npm run build:embedded
          test -f build-embedded/index.html
          test "$(jq -r .target build-embedded/querymt-ui.json)" = embedded
          test "$(jq -r .acpWebSocketPath build-embedded/querymt-ui.json)" = /acp/ws
          test "$(git rev-parse HEAD)" = "$QUERYMT_UI_REVISION"
          test "$(jq -r .revision build-embedded/querymt-ui.json)" = "$QUERYMT_UI_REVISION"

      - name: Upload embedded dashboard
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-ui
          path: build-embedded
          if-no-files-found: error

  build:
    name: Build ${{ matrix.binary }} for ${{ matrix.target }}
    needs: dashboard-ui
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Linux (Static MUSL) ──────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote

          # ─── macOS ─────────────────────────────────────────────────────────
          - os: macos-14
            target: x86_64-apple-darwin
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
          - os: macos-14
            target: aarch64-apple-darwin
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote

          # ─── Windows (Static CRT) ────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmt
            bin_name: qmt.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmt
            bin_name: qmt.exe
            archive_ext: zip
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qmtcode
            bin_name: qmtcode.exe
            archive_ext: zip
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
            rust_flags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qmtcode
            bin_name: qmtcode.exe
            archive_ext: zip
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote
            rust_flags: "-C target-feature=+crt-static"

          # ─── FreeBSD ──────────────────────────────────────────────────────────────
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmt
            bin_name: qmt
            archive_ext: tar.gz
          - os: freebsd
            target: x86_64-unknown-freebsd
            binary: qmtcode
            bin_name: qmtcode
            archive_ext: tar.gz
            cargo_package: querymt-agent
            cargo_features: oauth,dashboard,remote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.binary }}

      - name: Download embedded dashboard
        if: matrix.binary == 'qmtcode'
        uses: actions/download-artifact@v8
        with:
          name: dashboard-ui
          path: dashboard-ui

      # Build qmt binary (default package)
      - name: Build qmt with Cargo
        if: matrix.binary == 'qmt'
        env:
          QMT_VERSION: ${{ inputs.version_name }}
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --release --bin qmt --target ${{ matrix.target }}

      # Build qmtcode example binary
      - name: Build qmtcode with Cargo
        if: matrix.binary == 'qmtcode'
        env:
          QMT_VERSION: ${{ inputs.version_name }}
          QMT_UI_DIST: ${{ format('{0}/dashboard-ui', github.workspace) }}
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --release -p ${{ matrix.cargo_package }} --example qmtcode --features "${{ matrix.cargo_features }}" --target ${{ matrix.target }}

      - name: Prepare artifact for upload (Linux, macOS & FreeBSD)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          ARTIFACT_DIR="dist"
          PKG="${{ matrix.binary }}-${{ inputs.version_name }}-${{ matrix.target }}"
          STAGING="$ARTIFACT_DIR/$PKG"
          mkdir -p "$STAGING"
          
          # Copy binary from appropriate location
          if [ "${{ matrix.binary }}" = "qmt" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGING/"
          else
            cp "target/${{ matrix.target }}/release/examples/${{ matrix.bin_name }}" "$STAGING/"
          fi
          
          cp README.md LICENSE "$STAGING/"
          tar -czf "$ARTIFACT_DIR/${PKG}.tar.gz" -C "$ARTIFACT_DIR" "$PKG"
          echo "ASSET_PATH=$ARTIFACT_DIR/${PKG}.tar.gz" >> $GITHUB_ENV

      - name: Prepare artifact for upload (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ARTIFACT_DIR = "dist"
          $PKG = "${{ matrix.binary }}-${{ inputs.version_name }}-${{ matrix.target }}"
          $STAGING = Join-Path $ARTIFACT_DIR $PKG
          New-Item -ItemType Directory -Force -Path $STAGING
          
          # Copy binary from appropriate location
          if ("${{ matrix.binary }}" -eq "qmt") {
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $STAGING
          } else {
            Copy-Item "target/${{ matrix.target }}/release/examples/${{ matrix.bin_name }}" -Destination $STAGING
          }
          
          Copy-Item README.md, LICENSE -Destination $STAGING
          $ZIP_PATH = "$ARTIFACT_DIR/${PKG}.zip"
          Compress-Archive -Path (Join-Path $STAGING '*') -DestinationPath $ZIP_PATH -Force
          echo "ASSET_PATH=${ZIP_PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
