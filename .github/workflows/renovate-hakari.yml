name: Renovate hakari

# Renovate does not know about cargo-hakari. When a Renovate bump changes the
# feature/version unification (e.g. a new 0.x minor of a crate listed in the
# workspace-hack), the `Verify workspace-hack` job in lint.yml fails. This
# workflow regenerates the workspace-hack on Renovate branches and pushes the
# result, so the PR goes green without manual work.
#
# Ordering: this workflow is the only one that handles Renovate's own commit.
# Every other PR workflow skips jobs when `github.actor == 'renovate[bot]'`.
# This workflow always pushes a commit (empty if the workspace-hack was already
# up to date); that push is made by the PAT owner, so the regular PR CI runs on
# it. Net effect: hakari first, then everything else.
#
# Triggering on pull_request (not push) guarantees the PR exists before we
# push, so our push always produces a `synchronize` event for CI.
#
# The push uses HAKARI_PUSH_TOKEN (fine-grained PAT, Contents: read/write on
# this repo). A push made with the default GITHUB_TOKEN would not trigger CI
# again, leaving the PR without any checks.
#
# Loop safety: the job only runs for events caused by renovate[bot]; our own
# push is attributed to the PAT owner.
#
# The commit author below is listed in `gitIgnoredAuthors` in
# .github/renovate.json so Renovate keeps updating these branches.
#
# Branch protection: mark "Regenerate workspace-hack" as a required check. It
# is skipped (counts as passing) on non-Renovate PRs and on our own push, and
# pending/blocking on Renovate's commit until we are done.
on:
  pull_request:
  # Manual runs from a renovate/** branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hakari:
    name: Regenerate workspace-hack
    if: >-
      startsWith(github.head_ref || github.ref_name, 'renovate/') &&
      (github.actor == 'renovate[bot]' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Pin to the triggering commit. If the branch moved in the meantime,
          # the push below is rejected as non-fast-forward and the newer run
          # takes over.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.HAKARI_PUSH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Regenerate workspace-hack
        run: |
          # Empty the generated section first. When a bump crosses a `links`
          # boundary (e.g. rusqlite -> libsqlite3-sys), the stale pins make the
          # workspace unresolvable and every cargo command, hakari included, fails.
          sed -i '/^### BEGIN HAKARI SECTION/,/^### END HAKARI SECTION/{/^### /!d;}' \
            crates/workspace-hack/Cargo.toml
          cargo hakari generate
          cargo hakari manage-deps --yes

      - name: Commit and push (hands off to CI)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "hakari-bot"
          git config user.email "hakari-bot@querymt.invalid"
          if git diff --quiet; then
            git commit --allow-empty -m "ci: workspace-hack up to date"
          else
            git commit -am "chore: regenerate workspace-hack"
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
