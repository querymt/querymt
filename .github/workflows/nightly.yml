name: Nightly

on:
  schedule:
    # Runs at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    name: Check for changes since last nightly
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      last_commit: ${{ steps.check.outputs.last_commit }}
      version_name: ${{ steps.version.outputs.name }}
      qmt_version: ${{ steps.version.outputs.qmt_version }}
      dashboard_revision: ${{ steps.desktop.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history to compare
      
      - name: Resolve latest Desktop main
        id: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DESKTOP_SHA=$(gh api repos/querymt/querymt-desktop/commits/main --jq '.sha')
          test -n "$DESKTOP_SHA"
          echo "sha=$DESKTOP_SHA" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DESKTOP_SHA: ${{ steps.desktop.outputs.sha }}
        run: |
          # Compare both repositories against the revisions recorded by the last nightly.
          LAST_NIGHTLY_SHA=$(gh release view nightly --json targetCommitish --jq '.targetCommitish' 2>/dev/null || echo "")
          LAST_DESKTOP_SHA=$(
            gh release view nightly --json body --jq '.body' 2>/dev/null \
              | sed -n "s/^Dashboard UI: \`\([0-9a-f]\{40\}\)\`$/\1/p" \
              | head -n 1 \
              || true
          )
          CURRENT_SHA=$(git rev-parse HEAD)

          if [ -z "$LAST_NIGHTLY_SHA" ] \
            || [ "$LAST_NIGHTLY_SHA" != "$CURRENT_SHA" ] \
            || [ "$LAST_DESKTOP_SHA" != "$CURRENT_DESKTOP_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "QueryMT or Dashboard UI changed, or this is the first nightly build"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No QueryMT or Dashboard UI changes since the last nightly"
          fi

          echo "last_commit=$LAST_NIGHTLY_SHA" >> "$GITHUB_OUTPUT"

      # <base>-nightly.<UTC YYYYMMDDHHMMSS>: sortable semver. The timestamp is
      # taken once here and passed to every matrix job, so all binaries of one
      # nightly report the same version. `version_name` stays a plain asset
      # label so the rolling release URL and asset names are stable.
      - name: Test release scripts
        run: scripts/release/test-release-scripts.sh

      - name: Generate version string
        id: version
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(scripts/release/workspace-version.sh Cargo.toml)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          QMT_VERSION=$(git ls-remote --tags origin \
            | scripts/release/nightly-version.sh "$WORKSPACE_VERSION" "$TIMESTAMP")
          echo "Nightly version: $QMT_VERSION"
          echo "name=nightly" >> "$GITHUB_OUTPUT"
          echo "qmt_version=$QMT_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build Nightly Binaries
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    with:
      version_name: ${{ needs.check-changes.outputs.version_name }}
      qmt_version: ${{ needs.check-changes.outputs.qmt_version }}
      is_nightly: true
      dashboard_revision: ${{ needs.check-changes.outputs.dashboard_revision }}

  release:
    name: Create Nightly GitHub Release
    needs: [check-changes, build]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs replace the same rolling `nightly` release; never overlap.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QMT_VERSION: ${{ needs.check-changes.outputs.qmt_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          # Match qmt-* and qmtcode-*, but not the internal dashboard-ui artifact.
          pattern: 'qmt*-*'
          merge-multiple: true

      # Machine-readable manifest: consumers read the version and commit from
      # here instead of parsing asset names or release notes.
      - name: Write release.json
        run: |
          scripts/release/write-release-json.sh \
            "$QMT_VERSION" nightly "${{ github.sha }}" artifacts/release.json
          cat artifacts/release.json

      # The rolling release is replaced in three steps so the time without a
      # `nightly` release is a few seconds instead of the whole upload:
      #   1. upload everything to a draft release under a staging tag
      #      (drafts are invisible to the public and create no git tag),
      #   2. delete the previous `nightly` release and tag,
      #   3. retag the draft as `nightly` at this commit and publish it.
      # If the upload fails, the previous nightly is left untouched.
      - name: Create staging draft release
        id: draft
        env:
          DASHBOARD_REVISION: ${{ needs.check-changes.outputs.dashboard_revision }}
        run: |
          set -euo pipefail

          # Remove drafts left behind by an earlier failed run.
          for id in $(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id'); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
          done

          # The `Dashboard UI: <sha>` line is parsed by the next run's check-changes.
          cat > notes.md <<EOF
          **This is a pre-release build from the \`main\` branch.**

          It is not intended for production use.

          Version: \`${QMT_VERSION}\`
          Commit: \`${{ github.sha }}\`
          Dashboard UI: \`${DASHBOARD_REVISION}\`
          EOF

          gh release create nightly-staging \
            --draft \
            --title "Nightly Build (${QMT_VERSION})" \
            --notes-file notes.md \
            --prerelease \
            --target "${{ github.sha }}" \
            artifacts/*

          ID=$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id')
          test -n "$ID"
          test "$(wc -l <<<"$ID")" -eq 1
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          # A leftover tag without a release would stop the publish below from
          # creating the tag at the new commit.
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/nightly"
          fi

      - name: Publish nightly release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -f tag_name=nightly \
            -f target_commitish="${{ github.sha }}" \
            -F draft=false \
            -F prerelease=true

          # The tag must now point at this commit; check-changes relies on it.
          TAG_SHA=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" --jq '.object.sha')
          if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
            echo "::error::nightly tag points at ${TAG_SHA}, expected ${{ github.sha }}"
            exit 1
          fi

      # Tell querymt-desktop that a fresh nightly qmtcode release exists so it
      # can build its own nightly against it. GITHUB_TOKEN cannot dispatch
      # events to another repository, so this needs a PAT (fine-grained,
      # querymt-desktop only, Contents: Read & Write) stored as a secret.
      - name: Trigger querymt-desktop nightly
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_NIGHTLY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DESKTOP_NIGHTLY_DISPATCH_TOKEN is not set; skipping querymt-desktop nightly trigger"
            exit 0
          fi
          gh api repos/querymt/querymt-desktop/dispatches \
            -f event_type=qmtcode-nightly \
            -f "client_payload[querymt_sha]=${{ github.sha }}" \
            -f "client_payload[querymt_version]=${QMT_VERSION}"
