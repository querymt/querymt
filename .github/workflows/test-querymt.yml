name: Test querymt

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/querymt/**'
      - 'crates/provider-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/test-querymt.yml'
  pull_request:
    paths:
      - 'crates/querymt/**'
      - 'crates/provider-common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/actions/rust-setup/**'
      - '.github/workflows/test-querymt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Clippy and tests run in parallel: they share no build artifacts.
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    if: github.actor != 'renovate[bot]'  # handled by renovate-hakari.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: querymt-clippy

      - name: Run Clippy
        run: cargo clippy --package querymt --all-targets --all-features -- -D warnings

  # Job 3: Run tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.actor != 'renovate[bot]'  # handled by renovate-hakari.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          cache-key: querymt-test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Create coverage directory
        run: mkdir -p ./coverage

      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest \
            --package querymt \
            --lib --tests \
            --all-features \
            --codecov --output-path ./coverage/codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/codecov.json
          flags: querymt
          verbose: true
          fail_ci_if_error: false
