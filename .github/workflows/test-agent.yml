name: Test Agent

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/agent*/**'
      - 'crates/querymt-utils/**'
      - 'crates/cli/**'
      - 'crates/service-client/**'
      - 'crates/querymt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'
  pull_request:
    paths:
      - 'crates/agent*/**'
      - 'crates/querymt-utils/**'
      - 'crates/cli/**'
      - 'crates/service-client/**'
      - 'crates/querymt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'

permissions:
  contents: read

env:
  features: 'dashboard,oauth,zbus-secret-service,systemd-credentials,remote'

jobs:
  # Job 1: Check formatting (fast, fails first)
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Run Clippy (parallel with format)
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-clippy

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Run Clippy (querymt-agent-core)
        run: cargo clippy --package querymt-agent-core --all-targets -- -D warnings

      - name: Run Clippy (querymt-agent-index)
        run: cargo clippy --package querymt-agent-index --all-targets -- -D warnings

      - name: Run Clippy (querymt-agent-knowledge)
        run: cargo clippy --package querymt-agent-knowledge --all-targets -- -D warnings

      - name: Run Clippy
        run: cargo clippy --package querymt-agent --all-targets --features "${features}" -- -D warnings

  # Job 3: Run tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [format, clippy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-test

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Create coverage directory
        run: mkdir -p ./coverage

      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest \
            --package querymt-agent \
            --package querymt-agent-core \
            --package querymt-agent-index \
            --package querymt-agent-knowledge \
            --lib --tests \
            --features "${features}" \
            --codecov --output-path ./coverage/codecov.json

      # `--lib --tests` skips tests compiled into examples. The repository
      # knowledge maintenance CLI's exit-code and headless contracts live there.
      - name: Run example tests
        run: |
          cargo nextest run \
            --package querymt-agent \
            --example repository_knowledge \
            --features "${features}"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/codecov.json
          flags: agent
          verbose: true
          fail_ci_if_error: false

