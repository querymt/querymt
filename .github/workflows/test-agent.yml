name: Test Agent

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/agent/**'
      - 'crates/querymt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'
  pull_request:
    paths:
      - 'crates/agent/**'
      - 'crates/querymt/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'

permissions:
  contents: read

env:
  features: 'dashboard,oauth,remote'

jobs:
  # Job 1: Check formatting (fast, fails first)
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Run Clippy (parallel with format)
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-clippy

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Run Clippy
        run: cargo clippy --package querymt-agent --all-targets --features "${features}" -- -D warnings

  # Job 3: Run tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [format, clippy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-test

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Create coverage directory
        run: mkdir -p ./coverage

      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest \
            --package querymt-agent \
            --lib --tests \
            --features "${features}" \
            --codecov --output-path ./coverage/codecov.json
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/codecov.json
          flags: agent
          verbose: true
          fail_ci_if_error: false

  # Job 4: Run leases and orphaned-run reconciliation rely on OS file locks,
  # whose crash-release semantics differ on Windows.
  test-windows-run-lease:
    name: Run lease tests (Windows)
    runs-on: windows-latest
    needs: [format, clippy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-test-windows

      - name: Prepare embedded dashboard fixture
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dashboard-ui'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Set-Content -Path (Join-Path $dist 'index.html') -Value '<!doctype html><title>QueryMT</title>'
          Set-Content -Path (Join-Path $dist 'querymt-ui.json') -Value '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}'
          "QMT_UI_DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run lease, reconciliation and incident tests
        shell: bash
        # Lease, reconciliation and incident tests are named `run_lease_*`,
        # `reconcile_*` or `*orphan*`, or live in the run_lease/run_reconcile modules.
        run: >
          cargo nextest run -p querymt-agent --lib --features "${features}"
          -E 'test(/run_lease|run_reconcile|reconcile_|orphan|last_unfinished_run/)'

