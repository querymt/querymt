name: Test Agent

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/agent*/**'
      - 'crates/querymt-utils/**'
      - 'crates/cli/**'
      - 'crates/service-client/**'
      - 'crates/querymt/**'
      - 'crates/workspace-hack/**'
      - '.config/hakari.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'
  pull_request:
    paths:
      - 'crates/agent*/**'
      - 'crates/querymt-utils/**'
      - 'crates/cli/**'
      - 'crates/service-client/**'
      - 'crates/querymt/**'
      - 'crates/workspace-hack/**'
      - '.config/hakari.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-agent.yml'

permissions:
  contents: read

env:
  # Keep `features` and `runtime_features` in sync with the aliases in
  # .cargo/config.toml (t-agent, cl-agent, t-runtime, cl-runtime).
  features: 'dashboard,oauth,zbus-secret-service,systemd-credentials,remote'
  runtime_features: 'remote,oauth,plugin-loaders,api'

jobs:
  # Job 1: Check formatting (fast, fails first)
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

      # The workspace-hack crate unifies third-party features across the agent
      # stack (design D8); regenerate it with `cargo hakari generate` and
      # `cargo hakari manage-deps` when this fails.
      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Verify workspace-hack
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
          cargo hakari verify

  # Job 2: Run Clippy (parallel with format)
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-clippy

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Run Clippy (querymt-agent-core)
        run: cargo clippy --package querymt-agent-core --all-targets -- -D warnings

      # Core builds on its own and must not depend on rmcp, querymt-utils or
      # rusqlite (design D7).
      - name: Check querymt-agent-core standalone and dependency exclusions
        run: |
          cargo check --package querymt-agent-core --no-default-features
          cargo check --package querymt-agent-core --features test-support
          tree="$(cargo tree --package querymt-agent-core --edges normal)"
          for forbidden in rmcp querymt-utils rusqlite; do
            if [[ "$tree" == *"── ${forbidden} v"* ]]; then
              echo "querymt-agent-core must not depend on ${forbidden}" >&2
              exit 1
            fi
          done

      - name: Check querymt-agent-sqlite standalone
        run: |
          cargo check --package querymt-agent-sqlite --no-default-features
          cargo check --package querymt-agent-sqlite --features test-support

      - name: Run Clippy (querymt-agent-sqlite)
        run: cargo clippy --package querymt-agent-sqlite --all-targets -- -D warnings

      - name: Check querymt-agent-services standalone
        run: |
          cargo check --package querymt-agent-services --no-default-features
          cargo check --package querymt-agent-services --features test-support

      - name: Run Clippy (querymt-agent-services)
        run: cargo clippy --package querymt-agent-services --all-targets -- -D warnings

      - name: Run Clippy (querymt-agent-index)
        run: cargo clippy --package querymt-agent-index --all-targets -- -D warnings

      - name: Run Clippy (querymt-agent-knowledge)
        run: cargo clippy --package querymt-agent-knowledge --all-targets -- -D warnings

      # The runtime has its own feature set; it must build without the facade.
      - name: Check querymt-agent-runtime standalone
        run: |
          cargo check --package querymt-agent-runtime --no-default-features
          cargo check --package querymt-agent-runtime --features test-support
          cargo check --package querymt-agent-runtime --features "${runtime_features}"

      - name: Run Clippy (querymt-agent-runtime)
        run: cargo clippy --package querymt-agent-runtime --all-targets --features "${runtime_features}" -- -D warnings

      - name: Check querymt-agent facade without default features
        run: cargo check --package querymt-agent --lib --no-default-features

      - name: Run Clippy
        run: cargo clippy --package querymt-agent --all-targets --features "${features}" -- -D warnings

  # Job 3: Run tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [format, clippy]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: agent-test

      - name: Prepare embedded dashboard fixture
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-ui"
          printf '<!doctype html><title>QueryMT</title>\n' > "$RUNNER_TEMP/dashboard-ui/index.html"
          printf '{"revision":"ci","target":"embedded","acpWebSocketPath":"/acp/ws"}\n' > "$RUNNER_TEMP/dashboard-ui/querymt-ui.json"
          echo "QMT_UI_DIST=$RUNNER_TEMP/dashboard-ui" >> "$GITHUB_ENV"
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Create coverage directory
        run: mkdir -p ./coverage

      - name: Run tests with coverage
        run: |
          cargo llvm-cov nextest \
            --package querymt-agent \
            --package querymt-agent-core \
            --package querymt-agent-sqlite \
            --package querymt-agent-index \
            --package querymt-agent-knowledge \
            --package querymt-agent-services \
            --package querymt-agent-runtime \
            --lib --tests \
            --features "${features}" \
            --codecov --output-path ./coverage/codecov.json

      # `--lib --tests` skips tests compiled into examples. The repository
      # knowledge maintenance CLI's exit-code and headless contracts live there.
      - name: Run example tests
        run: |
          cargo nextest run \
            --package querymt-agent \
            --example repository_knowledge \
            --features "${features}"

      # This repository's own knowledge corpus must stay consistent: a moved
      # note or an include pattern that matches nothing fails here.
      - name: Check repository knowledge corpus
        run: |
          cargo run --package querymt-agent \
            --example repository_knowledge \
            --features "${features}" \
            -- --root . check
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/codecov.json
          flags: agent
          verbose: true
          fail_ci_if_error: false

