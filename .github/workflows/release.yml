name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-ui:
    name: Resolve dashboard revision
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Read embedded UI pin
        id: pin
        run: |
          revision=$(tr -d '[:space:]' < crates/agent/embedded-ui-revision)
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    name: Build Release Binaries
    needs: resolve-ui
    uses: ./.github/workflows/build.yml
    with:
      version_name: ${{ github.ref_name }}
      is_nightly: false
      dashboard_revision: ${{ needs.resolve-ui.outputs.revision }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          # Match qmt-* and qmtcode-*, but not the internal dashboard-ui artifact.
          pattern: 'qmt*-*'
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
