# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "querymt-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# Limit the workspace-hack to the agent stack: providers (wasm32-wasip1 plugins),
# Python bindings and the mobile FFI must not inherit host-only features.
[traversal-excludes]
workspace-members = [
    "qmt-alibaba", "qmt-anthropic", "qmt-codex", "qmt-deepseek", "qmt-google", "qmt-groq",
    "qmt-izwi", "qmt-kimi-code", "qmt-llama-cpp", "qmt-mistral", "qmt-moonshot", "qmt-mrs",
    "qmt-ollama", "qmt-openai", "qmt-openrouter", "qmt-xai", "qmt-zai",
    "querymt-agent-py", "querymt-py", "querymt-mobile-ffi", "querymt-extism-macros",
    "querymt-provider-common", "querymt-cli",
    # Standalone ACP/MCP client binaries: keep the agent stack out of their builds.
    "qmacp", "qmcp",
    # The GPUI desktop app also builds for wasm32-unknown-unknown and talks to
    # agents only over ACP: it must not inherit the agent stack's host features.
    "querymt-gpui",
]

# `querymt` is shared with the wasm32-wasip1 provider plugins, which must not
# inherit host-only features: it still counts for unification but does not get
# the workspace-hack dependency.
# `querymt-agent-protocol-types` (and the session-core crates) must build for
# wasm32-unknown-unknown and for clients outside this workspace, so their closure
# must not contain tokio, rusqlite or the workspace-hack.
[final-excludes]
workspace-members = ["querymt", "querymt-agent-protocol-types", "querymt-agent-session-core"]
