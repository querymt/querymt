[profile.default]
# Kill any test that takes longer than 60 s (2 strikes = termination).
# This prevents a single stuck mesh/networking test from blocking the entire
# CI job for 90+ minutes, as was observed with the llvm-cov --all-targets run.
slow-timeout = { period = "60s", terminate-after = 2 }

# Mesh and DHT tests do real libp2p I/O under coverage instrumentation and
# legitimately need more time on loaded CI runners.
[[profile.default.overrides]]
filter = 'test(mesh) | test(remote) | test(relay) | test(forwarder)'
slow-timeout = { period = "120s", terminate-after = 2 }

# Used by CI (`cargo nextest run --profile ci`): report every failure instead of
# stopping at the first. Per-test overrides from the default profile still apply.
[profile.ci]
fail-fast = false

# The startup gap test budgets 50 ms of unattributed time, so scheduler noise
# from other tests must not eat it: it runs alone (`threads-required` takes
# every test slot) and in a group of its own.
[test-groups]
startup-gap = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(no_unattributed_startup_time)'
test-group = 'startup-gap'
threads-required = "num-test-threads"
