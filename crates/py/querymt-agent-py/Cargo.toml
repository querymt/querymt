[package]
name = "querymt-agent-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for QueryMT Agent"

# Not on [workspace.lints] yet: the clippy lints there still flag existing code in
# this crate. An empty table records the opt-out; replace it with
# `workspace = true` once the crate is clean.
[lints]

[lib]
name = "querymt_agent"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0"
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
querymt-agent = { path = "../../agent", default-features = false, features = ["api", "plugin-loaders", "remote"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }

[package.metadata.maturin]
name = "querymt-agent"
features = ["extension-module"]
