[package]
name = "querymt-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for QueryMT"

# Not on [workspace.lints] yet: the clippy lints there still flag existing code in
# this crate. An empty table records the opt-out; replace it with
# `workspace = true` once the crate is clean.
[lints]

[lib]
name = "querymt"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0"
base64.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
querymt = { path = "../../querymt", default-features = false, features = ["desktop"] }
querymt-remote = { path = "../../querymt-remote", features = ["kameo-mesh"] }
querymt-utils = { path = "../../querymt-utils", features = ["providers"] }
serde_json.workspace = true
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
futures-util = "0.3"
log.workspace = true

[package.metadata.maturin]
name = "querymt"
features = ["extension-module"]
