[package]
name = "qmt-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.qmt]
type = "wasm"

# Not on [workspace.lints] yet: the clippy lints there still flag existing code in
# this crate. An empty table records the opt-out; replace it with
# `workspace = true` once the crate is clean.
[lints]

[features]
default = ["extism"]
api = ["querymt"]
native = ["api"]
extism = ["extism-pdk", "api", "querymt-extism-macros"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
querymt = { path = "../../querymt", default-features = false, optional = true }
querymt-extism-macros = { path = "../../querymt-extism-macros", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
sha2 = "0.11"
log = { workspace = true }
extism-pdk = { workspace = true, optional = true }
