[package]
name = "qmt-mrs"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.qmt]
type = "native"

# Not on [workspace.lints] yet: the clippy lints there still flag existing code in
# this crate. An empty table records the opt-out; replace it with
# `workspace = true` once the crate is clean.
[lints]

[features]
default = ["native"]
api = ["querymt", "querymt/tracing"]
native = ["api"]
cuda = ["mistralrs/cuda"]
cudnn = ["mistralrs/cudnn"]
metal = ["mistralrs/metal"]
flash-attn = ["mistralrs/flash-attn"]
accelerate = ["mistralrs/accelerate"]
mkl = ["mistralrs/mkl"]
nccl = ["mistralrs/nccl"]
ring = ["mistralrs/ring"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
querymt = { path = "../../querymt", default-features = false, optional = true }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
schemars.workspace = true
futures.workspace = true
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", tag = "v0.9.5" }
async-trait.workspace = true
tokio = { version = "1", features = ["full"] }
image = "0.25"
log.workspace = true
querymt-provider-common = { path = "../../provider-common" }
