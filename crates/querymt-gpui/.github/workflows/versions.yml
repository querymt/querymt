name: version-consistency

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check app versions and release tag
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path

          def load(path):
              return tomllib.loads(Path(path).read_text())

          # flake.nix reads its version from Cargo.toml, so it cannot drift.
          versions = {
              'Cargo.toml': load('Cargo.toml')['package']['version'],
              'Cargo.lock': next(p['version'] for p in load('Cargo.lock')['package'] if p['name'] == 'querymt-gpui'),
          }
          expected = versions['Cargo.toml']
          for source, version in versions.items():
              assert version == expected, f'{source}: {version} != {expected}'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{expected}', f'Release tag must be v{expected}'
          print(f'All app versions match: {expected}')
          PY
