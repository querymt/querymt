name: nightly

# Builds QueryMT GPUI and publishes a rolling `nightly` prerelease.
#
# Triggers:
#   - schedule: daily. Skipped when nothing changed since the last nightly.
#   - workflow_dispatch: ad-hoc build. Always builds.
#
# Unlike querymt-desktop, the app bundles no qmtcode sidecar, so there is no
# QueryMT nightly to resolve and no repository_dispatch from querymt/querymt.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Serialize runs: they all replace the same rolling `nightly` release.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-changes:
    name: Check for changes since last nightly
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      version_name: ${{ steps.version.outputs.name }}
      nightly_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release scripts
        run: bash scripts/release/test-release-scripts.sh

      - name: Check for changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          LAST_SHA=$(gh release view nightly --json targetCommitish --jq '.targetCommitish // empty' 2>/dev/null || true)
          if [ -z "$LAST_SHA" ] || [ "$LAST_SHA" != "$CURRENT_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "GPUI changed, or this is the first nightly build"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No GPUI changes since the last nightly"
          fi

      # <base>-nightly.<UTC YYYYMMDDHHMMSS>, computed once here and passed to
      # every matrix job so all artifacts of one nightly share a version.
      # `name` is the asset label, so the rolling release URLs stay stable.
      - name: Generate version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(git ls-remote --tags origin \
            | scripts/release/nightly-version.sh \
                "$(scripts/release/package-version.sh Cargo.toml)" \
                "$(date -u +%Y%m%d%H%M%S)")
          echo "Nightly version: $VERSION"
          echo "name=nightly" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  versions:
    name: Version consistency
    uses: ./.github/workflows/versions.yml
    permissions:
      contents: read

  web-ui:
    name: Web UI
    needs: [check-changes, versions]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/web-ui.yml
    permissions:
      contents: read

  build:
    name: ${{ matrix.name }}
    needs: [check-changes, versions]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            asset_prefix: QueryMT-GPUI
            asset_suffix: macos-aarch64
          - name: macOS Intel
            platform: macos-26-intel
            target: x86_64-apple-darwin
            asset_prefix: QueryMT-GPUI
            asset_suffix: macos-x86_64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_prefix: QueryMT-GPUI
            asset_suffix: windows-x64-setup
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_prefix: QueryMT-GPUI
            asset_suffix: linux-x86_64
            arch: x86_64
            nfpm_arch: x86_64
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - name: Linux arm64
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_prefix: QueryMT-GPUI
            asset_suffix: linux-aarch64
            arch: aarch64
            nfpm_arch: arm64
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

    env:
      VERSION_NAME: ${{ needs.check-changes.outputs.version_name }}
      NIGHTLY_VERSION: ${{ needs.check-changes.outputs.nightly_version }}
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Linux packaging tools
        if: startsWith(matrix.platform, 'ubuntu-')
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_VERSION: '2.48.0'
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          APPIMAGE_ARCH: ${{ matrix.arch }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          APPIMAGE_RUNTIME_VERSION: '20251108'
          APPIMAGE_RUNTIME_SHA256: ${{ matrix.appimage_runtime_sha256 }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/nfpm.tar.gz -C "$HOME/.local/bin" nfpm
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          echo "${APPIMAGETOOL_SHA256}  $HOME/.local/bin/appimagetool" | sha256sum --check --strict
          curl -fsSL -o "$HOME/.local/bin/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${APPIMAGE_ARCH}"
          echo "${APPIMAGE_RUNTIME_SHA256}  $HOME/.local/bin/appimage-runtime" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/nfpm" "$HOME/.local/bin/appimagetool" \
            "$HOME/.local/bin/appimage-runtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # GPUI compiles its Metal shaders with `xcrun metal`; Xcode 26 ships the
      # Metal toolchain as a separate component.
      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      # Stamp the app version (the same <base>-nightly.<timestamp> the release
      # carries) in the CI workspace only; versions.yml already validated the
      # committed files.
      - name: Stamp nightly version
        shell: bash
        run: bash scripts/release/stamp-version.sh "$NIGHTLY_VERSION"

      - name: Build app
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package macOS bundles
        if: runner.os == 'macOS'
        run: bash scripts/package/macos.sh "$NIGHTLY_VERSION" ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package/windows.sh "$NIGHTLY_VERSION" ${{ matrix.target }}

      - name: Package Linux bundles
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_RUNTIME_FILE="$HOME/.local/bin/appimage-runtime" \
            bash scripts/package/linux.sh "$NIGHTLY_VERSION" ${{ matrix.target }}

      - name: Collect nightly assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET_PREFIX: ${{ matrix.asset_prefix }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: bash scripts/release/collect-bundles.sh

      - name: Upload nightly assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    needs: [check-changes, web-ui, build]
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_NAME: ${{ needs.check-changes.outputs.version_name }}
      NIGHTLY_VERSION: ${{ needs.check-changes.outputs.nightly_version }}
    steps:
      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: 'nightly-*'
          merge-multiple: true

      - name: Download web UI artifact
        uses: actions/download-artifact@v8
        with:
          name: querymt-gpui-web
          path: web-ui

      - name: Name web UI release assets
        run: |
          test -f web-ui/querymt-gpui-web.tar.gz
          test -f web-ui/dist/index.html
          test -s web-ui/dist/querymt_gpui_bg.wasm

          cp web-ui/querymt-gpui-web.tar.gz "artifacts/querymt-gpui-web-${VERSION_NAME}.tar.gz"

      # The commit SHA lives in the notes only; it is not part of any version.
      - name: Write release notes
        env:
          GPUI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **This is a pre-release nightly build of QueryMT GPUI.**

          It is not intended for production use.

          Version: \`${NIGHTLY_VERSION}\`
          Commit: \`${GPUI_SHA}\`
          EOF

      # One combined checksum file instead of a .sha256 file per asset.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l

      # The rolling release is replaced in three steps so the time without a
      # `nightly` release is a few seconds instead of the whole upload:
      #   1. upload everything to a draft release under a staging tag
      #      (drafts are invisible to the public and create no git tag),
      #   2. delete the previous `nightly` release and tag,
      #   3. retag the draft as `nightly` at this commit and publish it.
      # If the upload fails, the previous nightly is left untouched.
      - name: Create staging draft release
        id: draft
        env:
          GPUI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Remove drafts left behind by an earlier failed run.
          for id in $(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id'); do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
          done

          gh release create nightly-staging \
            --draft \
            --title "Nightly Build (${NIGHTLY_VERSION})" \
            --notes-file notes.md \
            --prerelease \
            --target "$GPUI_SHA" \
            artifacts/*

          ID=$(gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id')
          test -n "$ID"
          test "$(wc -l <<<"$ID")" -eq 1
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          # A leftover tag without a release would stop the publish below from
          # creating the tag at the new commit.
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/nightly"
          fi

      - name: Publish nightly release
        env:
          GPUI_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -f tag_name=nightly \
            -f target_commitish="$GPUI_SHA" \
            -F draft=false \
            -F prerelease=true

          # The tag must now point at this commit; check-changes relies on it.
          TAG_SHA=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" --jq '.object.sha')
          if [ "$TAG_SHA" != "$GPUI_SHA" ]; then
            echo "::error::nightly tag points at ${TAG_SHA}, expected ${GPUI_SHA}"
            exit 1
          fi

      # The published checksums must list every asset of this nightly.
      - name: Verify published release
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            curl -fsSL "https://github.com/${GH_REPO}/releases/download/nightly/SHA256SUMS" -o published.txt && break
            sleep 5
          done
          # 2 macOS x (dmg + app.tar.gz), Windows setup, 2 Linux x (AppImage + deb), web UI.
          test "$(wc -l < published.txt)" -eq 10
          cat published.txt
