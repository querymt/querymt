name: web-ui

# The wasm build of the app (web/build.sh --release), packaged like
# querymt-desktop's embedded UI so qmtcode or any static server can serve it.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen` crate version in Cargo.lock (see flake.nix).
  WASM_BINDGEN_VERSION: '0.2.130'
  BINARYEN_VERSION: '133'
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      - name: Install wasm-opt (binaryen)
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local"
          tar -xzf /tmp/binaryen.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - run: ./web/build.sh --release

      - name: Verify web artifact
        run: |
          test -f dist/index.html
          test -f dist/querymt_gpui.js
          test -s dist/querymt_gpui_bg.wasm
          grep -q 'querymt_gpui.js' dist/index.html

      - name: Package web artifact
        run: |
          tar -czf querymt-gpui-web.tar.gz -C dist .
          sha256sum querymt-gpui-web.tar.gz > querymt-gpui-web.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: querymt-gpui-web
          path: |
            dist/
            querymt-gpui-web.tar.gz
            querymt-gpui-web.tar.gz.sha256
          if-no-files-found: error
