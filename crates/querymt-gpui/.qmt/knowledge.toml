version = 1

# Repository knowledge for querymt-gpui (read by QueryMT's `repo_knowledge_*`
# tools when the host profile sets `[agent.repository_knowledge] enabled = true`).
#
# Reviewed concept notes live in `knowledge/`. Code is selected narrowly on
# purpose: a selected source file is what lets a note attach to an `index` call
# on that file, but selecting everything (src/ui alone is ~40k lines) fills
# search results with symbol hits that bury the notes.
#
# Check with (from a querymt checkout):
#   cargo run -p querymt-agent --example repository_knowledge -- --root <this repo> check

[documents]
include = [
  "knowledge/*.md",
  "openspec/specs/*/spec.md",
  "openspec/changes/*/design.md",
  "openspec/changes/archive/*/design.md",
]
exclude = []

[code]
include = [
  "Cargo.toml",
  "build.rs",
  "flake.nix",
  "web/build.sh",
  ".github/workflows/test.yml",
  "src/main.rs",
  "src/transport.rs",
  "src/rpc.rs",
  "src/rpc_log.rs",
  "src/store.rs",
  "src/store/*.rs",
  "src/session.rs",
  "src/session/*.rs",
  "src/quick/*.rs",
  "src/quick/chrome/*.rs",
  "src/ui/mod.rs",
  "src/ui/session_pane.rs",
  "src/ui/model_picker.rs",
  "src/ui/keys.rs",
  "src/search.rs",
  "src/theme.rs",
]
# Test modules are large and would bury the notes in search results.
exclude = [
  "src/store/open_tests.rs",
  "src/session/golden.rs",
  "src/session/view_tests.rs",
  "src/quick/tests.rs",
]

[orientation]
entrypoints = ["knowledge/README.md"]
# Specs and design docs stay searchable but are never attached unasked: their
# normative wording matches ordinary requests and produces false cards.
retrieval_only = ["openspec/**"]
