[package]
name = "querymt-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime layer of the querymt agent: agent handle, sessions, ACP, mesh, auth, config and middleware"

[lib]
name = "querymt_agent_runtime"
path = "src/lib.rs"

[features]
# Kameo remote actors, libp2p mesh and the QR/invite flows.
remote = ["kameo/remote", "dep:libp2p", "querymt-remote/kameo-mesh", "querymt-remote/qr"]
# OAuth token support (keyring) and rmcp's OAuth client.
oauth = ["querymt-utils/oauth", "rmcp/auth"]
# Dynamic provider plugin loading.
plugin-loaders = ["querymt/dynamic-plugins"]
# Reported through `control::capabilities` (WebSocket API server in the top crate).
api = []
# Test helpers for the layers above (design D6): `TestAgent`, the mock LLM
# provider, `mcp_harness` and the drivers.
test-support = [
    "querymt-agent-core/test-support",
    "querymt-agent-services/test-support",
    "dep:querymt-agent-sqlite",
    "querymt-agent-sqlite/test-support",
    "dep:mockall",
    "dep:rusqlite",
    "rmcp/server",
    "opentelemetry_sdk/testing",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
typeshare.workspace = true
querymt = { path = "../querymt", default-features = false, features = ["runtime"] }
querymt-remote = { path = "../querymt-remote" }
querymt-provider-common = { path = "../provider-common" }
querymt-utils = { path = "../querymt-utils", features = ["providers", "serde", "secret-store"] }
querymt-agent-core = { path = "../agent-core" }
querymt-agent-index = { path = "../agent-index" }
querymt-agent-knowledge = { path = "../agent-knowledge" }
querymt-agent-services = { path = "../agent-services" }
agent-client-protocol.workspace = true
kameo = "0.22"
rmp-serde = "1.3"
kameo_actors = "0.8.1"
libp2p = { version = "0.56", optional = true, default-features = false }
async-trait.workspace = true
http.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
tracing = { version = "0.1", features = ["attributes", "release_max_level_debug"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
schemars.workspace = true
jsonschema = "0.61"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "deflate"] }
time.workspace = true
uuid.workspace = true
url.workspace = true
rand = "0.10"
ignore = "0.4.25"
glob = "0.3"
arc-swap = "1.7"
once_cell = "1.21"
parking_lot = "0.13"
moka = { version = "0.12", features = ["future", "sync"] }
rmcp = { version = "3.9", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-async-rw", "elicitation", "reqwest"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
toml.workspace = true
minijinja = { version = "3", default-features = false, features = ["serde"] }
iana-time-zone = "0.1"
regex.workspace = true
tokio-util = { version = "0.7", features = ["compat", "rt"] }
base64.workspace = true
hex = "0.4"
sha2 = "0.11"
infer = "0.22"
gray_matter = "0.3"
mdq = "0.10.0"
gix = { version = "0.90", default-features = false, features = ["basic", "worktree-mutation", "attributes", "sha1", "status", "merge"] }
dirs.workspace = true
dunce = "1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.33"
tempfile = "3.0"
querymt-agent-sqlite = { path = "../agent-sqlite", optional = true }
mockall = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["uuid", "time"], optional = true }
querymt-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rmcp = { version = "3.9", features = ["transport-streamable-http-client-unix-socket"] }

[dev-dependencies]
rusqlite = { workspace = true, features = ["uuid", "time"] }
querymt-agent-core = { path = "../agent-core", features = ["test-support"] }
querymt-agent-sqlite = { path = "../agent-sqlite", features = ["test-support"] }
querymt-agent-services = { path = "../agent-services", features = ["test-support"] }
rmcp = { version = "3.9", features = ["server", "transport-streamable-http-server"] }
mockall.workspace = true
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "testing"] }
