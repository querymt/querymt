# Frozen M5 pilot question set (format version 1).
#
# Sanitized: every item is a short task or question written for this fixture.
# None derives from a session transcript, a session database, a credential or
# a developer's absolute path (the loader rejects such fragments).
#
# `dev` items may be used to inspect results and tune the corpus. `held_out`
# items must not influence corpus authoring or the relevance gate: they were
# written before any replay was run, and held-out replay refuses to run when
# the compiled gate differs from the one recorded below.
#
# Expectations are repository-relative paths; a result counts when it cites any
# of them (a concept note or the source file it explains).

version = 1
revision = "42823824+worktree"          # HEAD plus the uncommitted pilot corpus; the corpus fingerprints below are the real pin
gate_version = 1
gate_fingerprint = "985e6fcb143a079c9aea1a8fe6ef8e00"

[frozen_corpus]
curated = "b7c75bf6ae632fa484e8c5add77ff80f"
baseline = "354b3ec283921d37d4440b343e86c542"

[[arm]]
name = "baseline"                        # no repository knowledge

[[arm]]
name = "curated"                         # reviewed concept notes + source maps
manifest = ".qmt/knowledge.toml"

# The exhaustive per-file purpose arm is intentionally NOT defined: its
# descriptions must be written and reviewed by a person, and scaffolding only
# creates empty rows. See crates/agent/knowledge/pilot/README.md.

# --- dev: navigation ------------------------------------------------------

