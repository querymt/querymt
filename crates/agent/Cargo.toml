[package]
name = "querymt-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent and Session management for querymt"

[features]
default = ["plugin-loaders"]
# Enables the ACP WebSocket and SFT export API server without dashboard assets.
api = ["querymt-agent-runtime/api"]
# QueryMT core runtime is always enabled; this remains as a compatibility alias
# for embedders that want the agent without dynamic plugin loading.
plugin-host-only = ["agent-mcp", "agent-tracing"]
# Desktop/plugin-loading support. Mobile embedders should use plugin-host-only.
plugin-loaders = ["plugin-host-only", "querymt/dynamic-plugins", "querymt-agent-runtime/plugin-loaders"]
agent-mcp = ["querymt/mcp"]
agent-tracing = ["querymt/tracing"]
# The dashboard server without the UI: dashboard routes, the same-origin ACP guard,
# asset serving and qmtcode's `--dashboard`, serving a placeholder page
# (dashboard-placeholder/). For checks and tests of that code without the wasm
# build (`cargo t-agent`, `cargo cl-agent`, CI).
dashboard-server = ["api", "plugin-loaders"]
# The dashboard server plus the embedded QueryMT Desktop web UI
# (crates/querymt-gpui built for wasm32-unknown-unknown with the
# release-gpui-web profile), served over same-origin ACP. build.rs builds it in
# target/querymt-gpui-web; QMT_UI_DIST names a prebuilt UI directory instead
# (release artifact).
dashboard = ["dashboard-server", "dep:wasm-bindgen-cli-support"]
# Enables OAuth token support for authentication (reads tokens from system keyring)
oauth = ["querymt-utils/oauth", "querymt-agent-runtime/oauth"]

zbus-secret-service = ["querymt-utils/zbus-secret-service"]
systemd-credentials = ["querymt-utils/systemd-credentials"]

# Enables kameo remote actor support for cross-machine session management.
remote = ["querymt-agent-runtime/remote", "kameo/remote", "dep:libp2p", "querymt-remote/kameo-mesh", "querymt-remote/qr"]
# Collect relay and address-lookup counters in mesh diagnostics.
remote-metrics = ["remote", "querymt-remote/iroh-metrics"]

[dependencies]
querymt = { path = "../querymt", default-features = false, features = ["runtime"] }
querymt-remote = { path = "../querymt-remote" }
querymt-provider-common = { path = "../provider-common" }
querymt-utils = { path = "../querymt-utils", features = ["providers", "serde", "secret-store"] }
querymt-agent-core = { path = "../agent-core" }
querymt-agent-index = { path = "../agent-index" }
querymt-agent-services = { path = "../agent-services" }
querymt-agent-sqlite = { path = "../agent-sqlite" }
querymt-agent-runtime = { path = "../agent-runtime" }
agent-client-protocol.workspace = true
kameo = "0.22"
libp2p = { version = "0.56", optional = true, default-features = false }
async-trait.workspace = true
http.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
tracing = { version = "0.1", features = ["attributes", "release_max_level_debug"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.0", features = ["full"] }
time.workspace = true
uuid.workspace = true
url.workspace = true
ignore = "0.4.25"
notify = "9"
arc-swap = "1.7"
once_cell = "1.21"
parking_lot = "0.13"

axum = { version = "0.8", features = ["macros", "ws"] }
# NOTE: Enabled `debug-embed` for testing debug builds on mobile.
rust-embed = { version = "8.6", features = ["axum", "include-exclude", "debug-embed", "interpolate-folder-path", "deterministic-timestamps"] }
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2.0"
futures-util = "0.3"
toml.workspace = true
tokio-util = { version = "0.7", features = ["compat", "rt"] }
base64.workspace = true
hex = "0.4"
sha2 = "0.11"

# Unix process-group cleanup on cancellation (shell tool)

# NLP: multilingual stopwords, stemming, language detection

# Markdown Query cli tool for agent `mdq` tool

# Snapshot backend support
dirs.workspace = true
# Windows-safe canonicalize (avoids \\?\ UNC prefixes) for tool path identity

# OAuth support (optional, feature-gated) - now provided by querymt-utils

# OpenTelemetry trace context extraction from ACP _meta

tempfile = "3.0"
querymt-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lib]
name = "querymt_agent"
path = "src/lib.rs"

[build-dependencies]
# wasm-bindgen as a library, so the dashboard build needs no wasm-bindgen CLI.
# Must match the `wasm-bindgen` crate version querymt-gpui pins.
wasm-bindgen-cli-support = { version = "=0.2.130", optional = true }

[dev-dependencies]
querymt-agent-runtime = { path = "../agent-runtime", features = ["test-support"] }
rusqlite = { workspace = true, features = ["uuid", "time"] }
querymt-agent-core = { path = "../agent-core", features = ["test-support"] }
querymt-agent-sqlite = { path = "../agent-sqlite", features = ["test-support"] }
querymt-agent-services = { path = "../agent-services", features = ["test-support"] }
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["async_tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"

[[test]]
name = "embedded_ui"
path = "build_support/gpui_web.rs"

[[bench]]
name = "agent_startup"
harness = false

[[bench]]
name = "session_list_view"
harness = false

[[bench]]
name = "session_load"
harness = false

[[bench]]
name = "event_emit"
harness = false

[[bench]]
name = "snapshot_track"
harness = false

[[bench]]
name = "turn_step"
harness = false
