[package]
name = "querymt-agent-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable repository knowledge for the querymt agent: manifest, index, retrieval and delivery selection"

[lib]
name = "querymt_agent_knowledge"
path = "src/lib.rs"

[dependencies]
querymt-agent-core = { path = "../agent-core" }
querymt-agent-index = { path = "../agent-index" }
# Same version as querymt-agent: libsqlite3-sys may be linked only once.
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.0", features = ["rt", "sync"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror = "2.0"
toml.workspace = true
hex = "0.4"
sha2 = "0.11"
glob = "0.3"
ignore = "0.4.25"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
