[package]
name = "querymt-agent-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite implementation of the querymt agent storage contracts"

# Not on [workspace.lints] yet: the clippy lints there still flag existing code in
# this crate. An empty table records the opt-out; replace it with
# `workspace = true` once the crate is clean.
[lints]

[lib]
name = "querymt_agent_sqlite"
path = "src/lib.rs"

[features]
# `TestStorage` and `sqlite_conn_with_schema` for tests in the layers above (design D6).
test-support = ["dep:tempfile", "querymt-agent-core/test-support"]

[dependencies]
querymt = { path = "../querymt", default-features = false }
querymt-agent-core = { path = "../agent-core" }
async-trait.workspace = true
log.workspace = true
parking_lot = "0.13"
rusqlite = { workspace = true, features = ["uuid", "time"] }
serde_json.workspace = true
tempfile = { version = "3.0", optional = true }
time = { workspace = true }
tokio = { version = "1.0", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { workspace = true }
querymt-workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
querymt-agent-core = { path = "../agent-core", features = ["test-support"] }
tempfile = "3.0"
tracing-subscriber = "0.3"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
