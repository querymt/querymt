<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting</title>
  <!--
    Root redirect template for `mike set-default -T`. Unlike mike's built-in
    template this uses an absolute URL, so the page can never redirect
    relative to an unknown path (/core/ -> /core/latest/ -> /core/latest/latest/ ...).
  -->
  <noscript>
    <meta http-equiv="refresh" content="1; url=/{{href}}" />
  </noscript>
  <script>
    window.location.replace(
      "/{{href}}" + window.location.search + window.location.hash
    );
  </script>
</head>
<body>
  Redirecting to <a href="/{{href}}">/{{href}}</a>...
</body>
</html>
