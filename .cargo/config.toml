# Standard local commands for the agent packages. They use the same package and
# feature sets as CI (.github/workflows/test-agent.yml: `features` and
# `runtime_features`), so local builds share artifacts with each other and
# with CI's flags. Keep the feature lists below in sync with that file.
#
#   AGENT_FEATURES   = dashboard-server,oauth,zbus-secret-service,systemd-credentials,remote
#   RUNTIME_FEATURES = remote,oauth,plugin-loaders,api
#
# `dashboard-server` covers the dashboard server code with a placeholder page, so
# t-agent/cl-agent never build the wasm UI and need no QMT_UI_DIST. The real
# `dashboard` feature (embedded QueryMT Desktop web) is built by
# .github/workflows/test-gpui.yml (dashboard-embed). Extra arguments are appended, for example
#   cargo t-runtime -E 'test(/compaction/)'
#   cargo t-agent --no-run

[alias]
t-agent = "nextest run -p querymt-agent --features dashboard-server,oauth,zbus-secret-service,systemd-credentials,remote"
t-runtime = "nextest run -p querymt-agent-runtime --features remote,oauth,plugin-loaders,api"
t-services = "nextest run -p querymt-agent-services"
t-sqlite = "nextest run -p querymt-agent-sqlite"
t-knowledge = "nextest run -p querymt-agent-knowledge"
t-index = "nextest run -p querymt-agent-index"
t-protocol = "nextest run -p querymt-agent-protocol-types --features test-support"
t-core = "nextest run -p querymt-agent-core"
# QueryMT Desktop (crates/querymt-gpui): its tests live in the bin target.
t-gpui = "nextest run -p querymt-gpui --bins"
# Run QueryMT Desktop as an optimized build (Cargo's default release profile:
# much faster than debug, much quicker to build than the shipped release-gpui).
# Arguments go to the app: `cargo r-gpui`, `cargo r-gpui --agent 127.0.0.1:42069`.
r-gpui = "run -p querymt-gpui --release --"

cl-agent = "clippy -p querymt-agent --all-targets --features dashboard-server,oauth,zbus-secret-service,systemd-credentials,remote -- -D warnings"
cl-runtime = "clippy -p querymt-agent-runtime --all-targets --features remote,oauth,plugin-loaders,api -- -D warnings"
cl-services = "clippy -p querymt-agent-services --all-targets -- -D warnings"
cl-sqlite = "clippy -p querymt-agent-sqlite --all-targets -- -D warnings"
cl-knowledge = "clippy -p querymt-agent-knowledge --all-targets -- -D warnings"
cl-index = "clippy -p querymt-agent-index --all-targets -- -D warnings"
cl-protocol = "clippy -p querymt-agent-protocol-types --all-targets --features test-support -- -D warnings"
cl-core = "clippy -p querymt-agent-core --all-targets -- -D warnings"
cl-gpui = "clippy -p querymt-gpui --all-targets -- -D warnings"
