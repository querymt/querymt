version = 1

# Reviewed concept notes kept next to the crate they describe (execution, tools,
# sessions, repository knowledge, profiles, config, delegation), plus the source
# files those notes explain. No exhaustive per-file inventory is
# selected here; that is an optional comparison arm (see
# crates/agent-knowledge/pilot/README.md).
#
# Code is selected narrowly on purpose: a selected source file is what lets a
# note attach to `index` results for that file, but broad selection fills search
# results with symbol hits that bury the notes.

[documents]
include = [
  "crates/agent-runtime/knowledge/*.md",
  "crates/agent-services/knowledge/*.md",
  "crates/agent-knowledge/knowledge/*.md",
  "crates/agent/knowledge/*.md",
  "crates/querymt-gpui/knowledge/*.md",
  "openspec/specs/*/spec.md",
]
exclude = []

[code]
include = [
  "crates/agent-runtime/src/agent/execution/*.rs",
  "crates/agent-runtime/src/agent/repository_delivery.rs",
  "crates/agent-runtime/src/knowledge/*.rs",
  "crates/agent-runtime/src/session/*.rs",
  "crates/agent-core/src/session/*.rs",
  "crates/agent-services/src/session/*.rs",
  "crates/agent-services/src/tools/*.rs",
  "crates/agent-services/src/tools/builtins/*.rs",
  "crates/agent-sqlite/src/session/sqlite_storage/*.rs",
  "crates/agent-knowledge/src/*.rs",
  "crates/agent/src/profiles.rs",
  "crates/agent-runtime/src/profile_host.rs",
  "crates/agent-core/src/config/*.rs",
  "crates/agent-runtime/src/config/*.rs",
  "crates/agent-core/src/delegation/*.rs",
  "crates/agent-runtime/src/delegation/*.rs",
  # querymt-gpui (the desktop app). src/ui alone is ~40k lines, so only the files
  # its notes explain are selected.
  "crates/querymt-gpui/Cargo.toml",
  "crates/querymt-gpui/build.rs",
  "crates/querymt-gpui/web/build.sh",
  ".github/workflows/test-gpui.yml",
  "crates/querymt-gpui/src/main.rs",
  "crates/querymt-gpui/src/transport.rs",
  "crates/querymt-gpui/src/rpc.rs",
  "crates/querymt-gpui/src/rpc_log.rs",
  "crates/querymt-gpui/src/store.rs",
  "crates/querymt-gpui/src/store/*.rs",
  "crates/querymt-gpui/src/session.rs",
  "crates/querymt-gpui/src/session/*.rs",
  "crates/querymt-gpui/src/quick/*.rs",
  "crates/querymt-gpui/src/quick/chrome/*.rs",
  "crates/querymt-gpui/src/ui/mod.rs",
  "crates/querymt-gpui/src/ui/session_pane.rs",
  "crates/querymt-gpui/src/ui/model_picker.rs",
  "crates/querymt-gpui/src/ui/keys.rs",
  "crates/querymt-gpui/src/search.rs",
  "crates/querymt-gpui/src/theme.rs",
  # The film harness and its scene files (the "Filming demo clips" note).
  "crates/querymt-gpui/src/film/*.rs",
  "crates/querymt-gpui/film/scenes/*.toml",
]
# The evaluation harness is not part of the subject matter being documented, and
# the config test module is large enough to bury the config note in search results.
exclude = [
  "crates/agent-knowledge/src/evaluation.rs",
  "crates/agent-runtime/src/config/tests.rs",
  # querymt-gpui test modules are large and would bury its notes.
  "crates/querymt-gpui/src/store/open_tests.rs",
  "crates/querymt-gpui/src/session/golden.rs",
  "crates/querymt-gpui/src/session/view_tests.rs",
  "crates/querymt-gpui/src/quick/tests.rs",
]

[orientation]
entrypoints = ["crates/agent-runtime/knowledge/README.md", "crates/querymt-gpui/knowledge/README.md"]
# Specs stay searchable but are never attached unasked: their normative
# wording matches ordinary requests and produced false cards.
retrieval_only = ["openspec/specs/**"]
