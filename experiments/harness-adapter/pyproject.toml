[project]
name = "querymt-harbor"
version = "0.1.0"
description = "Train, evaluate and publish a QueryMT harness adapter with TRL AsyncGRPO, Harbor and OpenEnv."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  # OpenEnv 0.7.0 requires harbor>=0.22.0; the exact version is pinned here.
  "openenv[harbor]==0.7.0",
  "harbor==0.25.0",
  # TRL at a recorded git commit (see [tool.uv.sources]).
  "trl",
  "peft",
  "datasets",
  "transformers>=5.2",
  "huggingface_hub",
  "trackio",
  # Not on PyPI and untagged: pinned to a recorded commit.
  "safeagents",
]

[project.optional-dependencies]
# Needed only on the GPU host / HF Jobs; CPU tests do not import vLLM.
gpu = ["vllm>=0.11; sys_platform == 'linux' and platform_machine == 'x86_64'"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
# huggingface/trl HEAD when this experiment was written.
trl = { git = "https://github.com/huggingface/trl", rev = "8773d24ff72db11cec960aa022583b61bf0074d9" }
# huggingface/safeagents HEAD when this experiment was written (no tags exist).
safeagents = { git = "https://github.com/huggingface/safeagents", rev = "dcf38e0a911d6e6a53966d46ecf1d9d6b86e3c01" }

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# openenv[harbor] pulls harbor[beam] -> beta9 (rich<15), while safeagents ->
# atif-scan needs rich>=15. This experiment never uses the Beam sandbox, so the
# newer rich wins. Revisit if Beam is ever used.
override-dependencies = ["rich>=15.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querymt_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs Docker, a GPU or network; gated by an environment variable"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored from OpenEnv v0.7.0 and kept identical to upstream (see the file's header).
extend-exclude = ["src/querymt_harbor/harbor_session.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The model card template is markdown: table rows and shell lines cannot be wrapped.
"src/querymt_harbor/publish.py" = ["E501"]
